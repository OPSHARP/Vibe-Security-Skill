<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4e6273;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#adf296;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#96c7f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f396e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg)" />
  
  <!-- Grid overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="200" rx="12" fill="url(#grid)" />

  <!-- Shield Icon (Abstract) -->
  <path d="M 120 50 L 170 50 L 170 90 C 170 120 145 145 120 150 C 95 145 70 120 70 90 L 70 50 L 120 50 Z" 
        fill="none" stroke="url(#textGrad)" stroke-width="4" transform="translate(-10, 0)"/>
  <path d="M 120 70 L 135 110 L 105 110 Z" fill="url(#textGrad)" transform="translate(-10, 0) opacity: 0.8"/>

  <!-- Text -->
  <text x="210" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="#f2f2f2">Vibe Security</text>
  <text x="560" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="300" font-size="52" fill="url(#textGrad)">Audit</text>
  <text x="214" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#96c7f2" letter-spacing="1">AGENT-AGNOSTIC SECURITY SKILL FOR AI CODING</text>
  
  <!-- Decorative Dots -->
  <circle cx="760" cy="40" r="3" fill="#adf296" opacity="0.8" />
  <circle cx="775" cy="40" r="3" fill="#f396e5" opacity="0.8" />
  <circle cx="760" cy="55" r="3" fill="#f396e5" opacity="0.8" />
  <circle cx="775" cy="55" r="3" fill="#adf296" opacity="0.8" />

</svg>